<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="ThinkZet">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C4DF0"/><stop offset=".5" stop-color="#A47AF5"/><stop offset="1" stop-color="#E88FC6"/></linearGradient>
    <radialGradient id="h" cx=".22" cy=".12" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".46"/><stop offset=".6" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#g)"/>
  <rect width="192" height="192" rx="44" fill="url(#h)"/>
  <rect x=".75" y=".75" width="190.5" height="190.5" rx="43.25" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
  <!-- A translucent echo behind the Z: the path not taken. -->
  <path d="M56 62 H136 L56 130 H136" transform="translate(10 12)" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- One continuous stroke: a line of thought that turns. -->
  <path d="M56 62 H136 L56 130 H136" fill="none" stroke="#fff" stroke-opacity=".97" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The moment of insight, with a soft halo. -->
  <circle cx="136" cy="62" r="19" fill="#fff" fill-opacity=".2"/>
  <circle cx="136" cy="62" r="9.5" fill="#fff"/>
</svg>
