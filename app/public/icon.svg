<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="ThinkZet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25213D"/>
      <stop offset="1" stop-color="#382541"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#E9A6D0"/>
      <stop offset="1" stop-color="#8DBBFF"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="190.5" height="190.5" rx="43.25" fill="none" stroke="#45405B" stroke-width="1.5"/>

  <!-- The Z is drawn as a single continuous stroke: a line of thought that turns. -->
  <path d="M56 62 H136 L56 130 H136"
        fill="none" stroke="url(#mark)" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The focal point: the moment of insight. -->
  <circle cx="136" cy="62" r="9" fill="#F5F2FC"/>
</svg>
