<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CareerOS AI — Opportunity Operating System</title>
<style>
:root{
  --bg:#0b0d10; --panel:#12161c; --panel2:#171c24; --line:#222a35; --line2:#2d3743;
  --ink:#e8edf4; --ink2:#9aa7b8; --muted:#68758a;
  --accent:#4c8dff; --accent2:#1f6feb; --good:#2fbf71; --warn:#f5a524; --bad:#f2545b;
  --radius:12px;
}
html[data-theme="light"]{
  --bg:#f7f9fc; --panel:#ffffff; --panel2:#f2f5f9; --line:#e2e8f0; --line2:#cdd7e3;
  --ink:#0e141b; --ink2:#41505f; --muted:#74828f;
  --accent:#1f6feb; --accent2:#1554c0;
}
html[data-theme="light"] body{color-scheme:light}
html[data-theme="light"] .rate-gap{background:linear-gradient(135deg,#efeaff,#e8f0ff 55%,#eaf7f1);border-color:#d7d0f0}
html[data-theme="light"] .rate-gap::after{background:radial-gradient(circle,rgba(139,92,246,.13),transparent 70%)}
html[data-theme="light"] .rate-gap .k{color:#6a52c8}
html[data-theme="light"] .score{box-shadow:none !important}
html[data-theme="light"] .palette{background:rgba(240,244,250,.75)}
html[data-theme="light"] pre{background:#0e1116}
html[data-theme="light"] .reveal{animation:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

.shell{display:grid;grid-template-columns:224px 1fr;height:100vh;overflow:hidden}
/* ---------- rail ---------- */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 18px}
.logo .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4c8dff,#8b5cf6);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.logo b{font-size:14px;letter-spacing:.02em}
.logo span{font-size:10px;color:var(--muted);display:block;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;padding-bottom:6px}
.nav-group{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
.nav-label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 10px 3px;opacity:.8}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-align:left;width:100%;font-size:13.5px}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.active{background:#1b2637;color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.nav .ico{width:16px;height:16px;display:grid;place-items:center;opacity:.72;flex-shrink:0}
.nav .ico svg{width:15px;height:15px}
.nav button.active .ico{opacity:1;color:var(--accent)}
.rail-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
.rail-foot a{color:var(--ink2)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}

/* ---------- main ---------- */
main{overflow:auto;padding:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:var(--muted)}
.topbar .spacer{flex:1}
.pill{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.live{border-color:#1f4d33;background:#0f2419;color:#6fe3a4}
.view{padding:26px 28px 90px;max-width:1180px}

/* ---------- shared ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink2)}
.grid{display:grid;gap:14px}
.row{display:flex;gap:12px;align-items:center}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.dim{color:var(--ink2)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.btn{background:var(--accent2);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:550}
.btn:hover{background:#2b7bf5}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink2)}
.btn.ghost:hover{color:var(--ink);border-color:#3d4a5c}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.chip{font-size:11px;padding:2px 7px;border-radius:5px;background:#1b2431;color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.chip.miss{background:#2a1c1e;border-color:#4a2b30;color:#f08b91}
.chip.have{background:#14251c;border-color:#24462f;color:#71d69c}
.chip.type{background:#161d2b;border-color:#26344a;color:#8fb4ee}
.bar{height:6px;border-radius:4px;background:#1c2431;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4c8dff,#8b5cf6)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
h2.section{font-size:15px;margin:26px 0 12px;font-weight:650;letter-spacing:-.01em}
h2.section:first-child{margin-top:0}

/* ---------- onboarding ---------- */
.onboard{max-width:760px;margin:0 auto;padding:48px 24px 80px}
.onboard .lead{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px}
.onboard .sub{color:var(--ink2);margin:0 0 22px}
textarea.cv{width:100%;height:260px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);resize:vertical;outline:none}
textarea.cv:focus{border-color:var(--accent2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--ink2)}
.field input,.field select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.note{font-size:12px;color:var(--muted);line-height:1.6}

/* ---------- feed ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.hello h2{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:650}
.hello .date{color:var(--muted);font-size:12.5px}
.rate-gap{background:linear-gradient(135deg,#1a1030 0%,#101a2e 55%,#0f1c1a 100%);border:1px solid #2f2a4d;border-radius:14px;padding:20px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.rate-gap::after{content:"";position:absolute;right:-40px;top:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 70%)}
.rate-gap .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a99bf0;font-weight:600}
.rate-gap .amount{font-size:34px;font-weight:750;letter-spacing:-.025em;margin:6px 0 2px}
.rate-gap .amount .neg{color:#ff8f96}
.rate-gap .scale{margin-top:16px;height:8px;border-radius:5px;background:#221d38;position:relative}
.rate-gap .scale .band{position:absolute;height:100%;border-radius:5px;background:linear-gradient(90deg,#3d2f6b,#6d5bd0)}
.rate-gap .scale .you{position:absolute;top:-5px;width:3px;height:18px;border-radius:2px;background:#fff}
.rate-gap .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
.types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.types button{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.types button.on{background:#1b2637;border-color:#33507a;color:#cfe0ff}
.feed-wrap{display:grid;grid-template-columns:1fr 268px;gap:16px;align-items:start}
.facets{position:sticky;top:74px}
@media(max-width:1180px){.feed-wrap{grid-template-columns:1fr}.facets{position:static}}
.facet-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.facet-row:last-child{border-bottom:none}
.facet-mini{height:4px;border-radius:3px;background:#1c2431;margin-top:3px;overflow:hidden}
.facet-mini > i{display:block;height:100%;background:linear-gradient(90deg,#4c8dff,#8b5cf6)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none}
.filters input{flex:1;min-width:200px}
.filters input:focus,.filters select:focus{border-color:var(--accent2)}
.filters .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.reveal{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.reveal{animation:none}}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;transition:border-color .12s}
.opp:hover{border-color:var(--line2)}
.score{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:19px;position:relative;letter-spacing:-.02em}
.score small{font-size:9px;display:block;text-align:center;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-top:-2px}
.opp h4{margin:0 0 3px;font-size:14.5px;font-weight:600}
.opp .meta{font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opp .why{font-size:11.5px;color:var(--muted);margin-top:6px}
.opp .right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.probs{display:flex;gap:10px;font-size:11px;color:var(--ink2)}
.probs b{display:block;font-size:14px;color:var(--ink);font-weight:650}

/* ---------- scores ---------- */
.scores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.score-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.score-card .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
.score-card .lbl{font-size:12px;color:var(--ink2);margin-bottom:8px}
.score-card .drv{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.overall{display:flex;gap:26px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ring div{width:92px;height:92px;border-radius:50%;background:var(--panel);display:grid;place-items:center;flex-direction:column}
.ring .v{font-size:30px;font-weight:750;letter-spacing:-.03em}
.ring .c{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* ---------- table ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:var(--panel2)}

/* ---------- copilot ---------- */
.chat{display:flex;flex-direction:column;height:calc(100vh - 130px);max-width:820px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.msg{max-width:82%;padding:11px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.6;font-size:13.5px}
.msg.user{align-self:flex-end;background:#1b2637;border:1px solid #2a3b52}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg .cite{margin-top:8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.suggest button{font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.suggest button:hover{color:var(--ink);border-color:#3d4a5c}
.composer{display:flex;gap:10px}
.composer input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;outline:none}
.composer input:focus{border-color:var(--accent2)}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.palette{position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:100}
.palette.open{display:flex}
.palette-box{width:min(640px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.palette-box input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:16px 18px;font-size:15px;outline:none;color:var(--ink)}
.palette-list{max-height:46vh;overflow:auto;padding:6px}
.palette-item{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.palette-item .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line2);padding:1px 5px;border-radius:4px;flex-shrink:0}
.palette-item.sel{background:#1b2637}
.palette-item .s{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.palette-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
kbd{background:#1b2431;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:10px;font-family:inherit;color:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b2637;border:1px solid #33507a;color:#cfe0ff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{display:none}.scores-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.opp{grid-template-columns:52px 1fr}.opp .right{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="logo">
      <div class="mark">C</div>
      <div><b>CareerOS</b><span>Opportunity OS</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group"><span class="nav-label">Today</span>
      <button data-view="brief"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3.4h10v9.2H3z"/><path d="M5.4 6.2h5.2M5.4 8.4h5.2M5.4 10.6h3"/></svg></span>Morning Brief</button>
      <button data-view="radar" class="active"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.6"/><path d="M8 8l5-4"/></svg></span>Opportunity Radar</button>
      </div>
      <div class="nav-group"><span class="nav-label">Intelligence</span>
      <button data-view="scores"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.4V8l2.6 1.6"/></svg></span>Career Score</button>
      <button data-view="rates"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 12V6M8 12V3M13 12V8"/><path d="M2 13.5h12"/></svg></span>Rate Intelligence</button>
      <button data-view="pulse"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.6 8.4h2.6L6 3.6l2.4 9 2-6.2 1.4 2h2.6"/></svg></span>Market Pulse</button>
      <button data-view="negotiation"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.4 11.4l3.2-3.6 2.4 2 3-3.8"/><path d="M13.6 4v3.4h-3.4"/><path d="M2.4 13.6h11.2"/></svg></span>Negotiation</button>
      <button data-view="trajectory"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13.4h12"/><path d="M2.6 10.6l3-3.4 2.4 1.8 3.4-4.6 2 1.6"/></svg></span>Trajectory</button>
      </div>
      <div class="nav-group"><span class="nav-label">Act</span>
      <button data-view="gaps"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12l4-5 3 2.5L14 4"/><path d="M11 4h3v3"/></svg></span>Skill Gaps</button>
      <button data-view="tracker"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.2" y="3" width="3.4" height="10" rx="1"/><rect x="6.4" y="3" width="3.4" height="6.5" rx="1"/><rect x="10.6" y="3" width="3.4" height="8.5" rx="1"/></svg></span>Tracker</button>
      <button data-view="copilot"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2l1.5 3.6L13 7l-3.5 1.4L8 12l-1.5-3.6L3 7l3.5-1.4z"/><path d="M12.4 11.2l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg></span>Copilot</button>
      <button data-view="searches"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2.4l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4L2.2 6.7l4-.6z"/></svg></span>Saved Searches</button>
      </div>
      <div class="nav-group"><span class="nav-label">Account</span>
      <button data-view="twin"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.4" r="2.6"/><path d="M2.8 13.4c0-2.6 2.3-4.2 5.2-4.2s5.2 1.6 5.2 4.2"/></svg></span>Career Twin</button>
      <button data-view="learning"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.4 8a5.4 5.4 0 11-1.7-3.9"/><path d="M13.6 2.6v3.2h-3.2"/></svg></span>Learning Loop</button>
      <button data-view="referrals"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6.4 9.6a2.6 2.6 0 003.7 0l2.1-2.1a2.6 2.6 0 00-3.7-3.7l-1 1"/><path d="M9.6 6.4a2.6 2.6 0 00-3.7 0L3.8 8.5a2.6 2.6 0 003.7 3.7l1-1"/></svg></span>Partners</button>
      <button data-view="plan"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.8" y="3.6" width="12.4" height="8.8" rx="1.6"/><path d="M1.8 6.6h12.4"/></svg></span>Plan</button>
      <button data-view="ops"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg></span>Engine</button>
      </div>
    </nav>
    <div class="rail-foot">
      <div><span class="dot"></span><span id="engine-status">engine online</span> <span id="new-badge" class="chip" style="margin-left:6px;display:none"></span></div>
      <div id="engine-counts">—</div>
      <div style="margin-top:8px"><a href="/strategy.html">Strategy documents <span style="opacity:.7">&gt;</span></a></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="view-title">Opportunity Radar</h1>
        <div class="sub" id="view-sub">Live</div>
      </div>
      <div class="spacer"></div>
      <span class="pill live" id="live-pill">● live feeds</span>
      <span class="pill" id="profile-pill">no profile</span>
      <button class="pill" id="theme" style="cursor:pointer" title="Toggle theme">◐ theme</button>
      <button class="pill" id="cmdk" style="cursor:pointer">⌘K search</button>
      <button class="btn ghost sm" id="run-ingest">Run ingest</button>
      <button class="btn ghost sm" id="load-demo">Load demo persona</button>
      <button class="pill" id="logout" style="cursor:pointer">Sign out</button>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="palette" id="palette">
  <div class="palette-box">
    <input id="palette-input" placeholder="Search opportunities, jump to a view, run a command…" autocomplete="off"/>
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span><span style="margin-left:auto"><kbd>⌘</kbd><kbd>K</kbd> anywhere</span></div>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const api = async (p, opt) => { const r = await fetch(p, opt); return r.json(); };
const post = (p, b) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b || {}) });
const money = (n, cur = 'EUR', d = 0) => n == null ? '—' : new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur, maximumFractionDigits: d }).format(n);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); };

let STATE = { profile: null, view: 'radar', feed: null, types: [], horizon: 'balanced', sort: 'score' };
const PERIOD_LABEL = { hour: '/hr', year: '/yr', month: '/mo', stipend: ' stipend', oneoff: ' one-off', prize: ' prize', fee: ' fee', investment: ' investment', equity: ' equity' };
const TYPE_LABEL = { job: 'Jobs', contract: 'Contracts', fellowship: 'Fellowships', grant: 'Grants', accelerator: 'Accelerators', cofounder: 'Co-founder', research: 'Research', hackathon: 'Hackathons', speaking: 'Speaking', mentorship: 'Mentorship' };

function scoreColor(s) {
  if (s >= 85) return ['#2fbf71', '#0f2419'];
  if (s >= 70) return ['#7bc96f', '#16241a'];
  if (s >= 55) return ['#f5a524', '#2a2113'];
  return ['#f2545b', '#2a1719'];
}

/* ---------------- auth ---------------- */
async function renderAuth() {
  $('#view-title').textContent = 'Sign in';
  $('#view-sub').textContent = 'Passwordless. One code, no passwords stored.';
  $('#view').innerHTML = `
  <div class="onboard" style="max-width:460px">
    <div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4c8dff,#8b5cf6);display:grid;place-items:center;font-weight:800;color:#fff;margin-bottom:20px">C</div>
    <p class="lead">Your career, with a memory.</p>
    <p class="sub">One profile. Every opportunity. Sign in and the engine starts watching.</p>
    <div id="auth-step1">
      <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"/></div>
      <button class="btn" id="auth-send" style="width:100%;margin-top:6px">Send me a code</button>
      <div class="note" style="margin-top:14px">No mail provider is connected in this environment, so the code appears on the next screen. In production it arrives by email.</div>
    </div>
    <div id="auth-step2" style="display:none">
      <div class="field"><label>6-digit code</label><input id="auth-code" inputmode="numeric" maxlength="6" placeholder="••••••" style="letter-spacing:.4em;font-size:18px;text-align:center"/></div>
      <button class="btn" id="auth-verify" style="width:100%;margin-top:6px">Verify &amp; continue</button>
      <div class="note" id="auth-hint" style="margin-top:12px"></div>
    </div>
    <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:16px">
      <button class="btn ghost" id="auth-demo" style="width:100%">Skip — explore the demo persona</button>
    </div>
  </div>`;

  $('#auth-send').onclick = async () => {
    const email = $('#auth-email').value.trim();
    if (!email) return toast('Enter an email');
    const r = await post('/api/auth/request', { email });
    if (r.error) return toast(r.error);
    $('#auth-step1').style.display = 'none';
    $('#auth-step2').style.display = 'block';
    $('#auth-hint').innerHTML = `Code for <b>${esc(r.sentTo)}</b> — <span class="mono" style="color:#cfe0ff;font-size:15px;letter-spacing:.2em">${esc(r.devCode)}</span> <span class="muted">(dev only — this would be an email)</span>`;
    $('#auth-code').focus();
  };
  $('#auth-verify').onclick = async () => {
    const r = await post('/api/auth/verify', { email: $('#auth-email').value.trim(), code: $('#auth-code').value.trim() });
    if (r.error) return toast(r.error);
    toast(`Welcome, ${r.user.name}`);
    await boot();
    go(r.hasProfile ? 'radar' : 'onboard');
  };
  $('#auth-code').onkeydown = (e) => { if (e.key === 'Enter') $('#auth-verify').click(); };
  $('#auth-demo').onclick = async () => { await loadDemo(); };
}

/* ---------------- onboarding ---------------- */
function renderOnboarding() {
  $('#view-title').textContent = 'Set up your Career Twin';
  $('#view-sub').textContent = 'One profile. Every opportunity.';
  $('#profile-pill').textContent = 'no profile';
  $('#view').innerHTML = `
  <div class="onboard">
    <p class="lead">Paste your CV. We'll build your Career Twin.</p>
    <p class="sub">Everything below is computed from your real profile against ${STATE.engineCounts?.opportunities || '—'} live opportunities. No mock numbers.</p>
    <textarea class="cv" id="cv" placeholder="Paste your CV here — experience, skills, current salary, target countries…"></textarea>
    <div style="margin:14px 0 22px" class="row">
      <button class="btn" id="parse">Parse &amp; build my twin</button>
      <button class="btn ghost" id="demo-inline">Or load the demo persona</button>
      <span class="note" id="parse-note"></span>
    </div>
    <div class="form-grid">
      <div class="field"><label>Seniority</label><select id="seniority"><option value="junior">Junior</option><option value="mid">Mid</option><option value="senior" selected>Senior</option><option value="staff">Staff</option><option value="lead">Lead</option><option value="principal">Principal</option></select></div>
      <div class="field"><label>Current rate (EUR)</label><input id="currentRate" type="number" placeholder="78000"/></div>
      <div class="field"><label>Rate unit</label><select id="rateUnit"><option value="year" selected>Per year</option><option value="hour">Per hour</option><option value="month">Per month</option></select></div>
      <div class="field"><label>Target minimum (EUR)</label><input id="targetRateMin" type="number" placeholder="100000"/></div>
      <div class="field"><label>Remote preference</label><select id="remotePreference"><option value="remote">Remote only</option><option value="any" selected>Any</option><option value="hybrid">Hybrid</option><option value="onsite">Onsite</option></select></div>
      <div class="field"><label>Visa sponsorship needed</label><select id="visaNeeded"><option value="1">Yes</option><option value="0">No</option></select></div>
    </div>
    <div class="note">The engine parses your CV deterministically (skill vocabulary of 58 canonical skills with aliases), then scores every opportunity on skill fit, seniority fit, income potential, location, freshness and channel quality — and calibrates interview/offer probability against priors.</div>
  </div>`;
  $('#parse').onclick = async () => {
    const btn = $('#parse'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Parsing…';
    const cv = $('#cv').value;
    if (cv.trim().length < 40) { toast('Paste a CV first (or load the demo)'); btn.disabled = false; btn.textContent = 'Parse & build my twin'; return; }
    const res = await post('/api/onboarding', {
      cv,
      seniority: $('#seniority').value,
      currentRate: $('#currentRate').value || null,
      rateUnit: $('#rateUnit').value,
      targetRateMin: $('#targetRateMin').value || null,
      remotePreference: $('#remotePreference').value,
      visaNeeded: $('#visaNeeded').value === '1',
    });
    btn.disabled = false; btn.textContent = 'Parse & build my twin';
    if (res.parsed) toast(`Parsed ${res.parsed.skills.length} skills · ${res.matched} opportunities scored`);
    await boot();
    go('radar');
  };
  $('#demo-inline').onclick = loadDemo;
}

async function loadDemo() {
  const b = $('#load-demo') || document.createElement('button');
  b.disabled = true;
  await post('/api/demo', {});
  await boot();
  b.disabled = false; b.textContent = 'Load demo persona';
  go('radar');
  toast('Demo persona loaded — 8 years, €78k, targeting DE/NL');
}

/* ---------------- radar ---------------- */
const FILTERS = { q: '', country: '', family: '', seniority: '', visa: false, degree: '', minScore: 45 };

async function renderRadar() {
  const feed = await api('/api/feed?limit=60' + (STATE.types.length ? '&types=' + STATE.types.join(',') : ''));
  if (feed.needsOnboarding) return renderOnboarding();
  STATE.feed = feed;
  const rates = await api('/api/rates');
  const s = feed.summary;
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  let planBanner = '';
  try {
    const plan = await api('/api/plan');
    STATE.plan = plan;
    if (plan.plan !== 'pro') {
      planBanner = `<div class="card" style="margin-bottom:14px;border-color:#2f2a4d;background:linear-gradient(90deg,#151129,#101a2e)">
        <div class="row" style="justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div style="flex:1;min-width:260px">
            <div style="font-size:13.5px;font-weight:600">You are on Free — showing your top ${plan.limits.matches} scored opportunities</div>
            <div class="dim" style="font-size:12.5px;margin-top:3px">Pro unlocks the full radar, saved searches, the daily brief and the copilot. €19/month, or €149/year.</div>
          </div>
          <button class="btn sm" id="upgrade">Unlock Pro</button>
        </div>
      </div>`;
    }
  } catch (e) {}
  let briefHtml = '';
  try {
    const brief = await api('/api/brief');
    if (brief && !brief.needsOnboarding) {
      STATE.brief = brief;
      briefHtml = `
      <div class="card" style="margin-bottom:14px;background:linear-gradient(180deg,#131a24,#11151b);border-color:#253247">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div style="flex:1">
            <div class="muted" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase">Today's brief · ${brief.counts.newSinceYesterday} new · ${brief.counts.closingSoon} closing soon</div>
            <div style="font-size:16px;font-weight:600;margin-top:6px;letter-spacing:-.01em">${esc(brief.headline)}</div>
          </div>
          <span class="muted" style="font-size:11px;white-space:nowrap">auto-acknowledged · <kbd>⌘</kbd><kbd>K</kbd> to search</span>
        </div>
        <div style="margin-top:14px;display:grid;grid-template-columns:repeat(${Math.min(4, brief.actions.length || 1)},1fr);gap:8px">
          ${brief.actions.map((a) => `<div class="action" data-opp="${a.opportunityId || ''}" style="border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel2);cursor:pointer">
            <div class="muted" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase">${a.priority === 1 ? 'do now' : a.priority === 2 ? 'this week' : 'keep warm'}</div>
            <div style="font-size:12.5px;margin-top:3px;line-height:1.45">${esc(a.text)}</div>
          </div>`).join('')}
        </div>
      </div>`;
    }
  } catch (e) { /* brief is additive — never block the radar */ }

  const gapHtml = rates && rates.gapPct != null ? (() => {
    const min = rates.p25 * 0.9, max = rates.p90 * 1.05;
    const pos = (v) => Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
    return `
    <div class="rate-gap">
      <div class="k">Rate intelligence · ${rates.sampleSize} comparable postings · ${rates.confidence} confidence · ${esc(rates.segment || '')}</div>
      <div class="amount">${rates.gapPct > 0 ? 'You are ' + rates.gapPct + '% below market' : rates.gapPct < 0 ? 'You are ' + Math.abs(rates.gapPct) + '% above market' : 'You are at market'}</div>
      <div class="dim">Median for your exact profile: <b>${money(rates.p50)}</b>${PERIOD_LABEL[rates.period] || ''} · you report <b>${money(rates.current)}</b>${PERIOD_LABEL[rates.period] || ''} ${rates.gapAbs > 0 ? `<span style="color:#ff8f96">(${money(rates.gapAbs)}/yr on the table)</span>` : ''}</div>
      <div class="scale">
        <div class="band" style="left:${pos(rates.p25)}%;width:${pos(rates.p75) - pos(rates.p25)}%"></div>
        <div class="you" style="left:${pos(rates.current)}%"></div>
      </div>
      <div class="legend"><span>p25 ${money(rates.p25)}</span><span>p50 ${money(rates.p50)}</span><span>p75 ${money(rates.p75)}</span><span>p90 ${money(rates.p90)}</span></div>
      <div style="margin-top:14px;font-size:12.5px" class="dim">Highest-paying channel: <b>${rates.byChannel[0] ? rates.byChannel[0].channel + ' · ' + money(rates.byChannel[0].median) : '—'}</b> · biggest lever: <b>${rates.topPayingSkills[0] ? rates.topPayingSkills[0].skill + ' (+' + rates.topPayingSkills[0].premium + '%)' : '—'}</b></div>
    </div>`;
  })() : '';

  $('#view').innerHTML = `
    <div class="hello">
      <div>
        <h2>${greeting}, ${esc(STATE.user?.name || 'there')}</h2>
        <div class="date">${dateStr} · ${s.detected} opportunities detected across ${Object.keys(s.counts).length} types</div>
      </div>
      <div style="text-align:right">
        <div class="muted" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">Highest Opportunity Score</div>
        <div style="font-size:28px;font-weight:750;letter-spacing:-.02em;color:${scoreColor(s.topScore)[0]}">${s.topScore}<span style="font-size:14px;color:var(--muted)">/100</span></div>
      </div>
    </div>
    ${planBanner}
    ${briefHtml}
    ${gapHtml}
    <div class="row" style="margin-bottom:10px;gap:10px;flex-wrap:wrap">
      <span class="muted" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">Optimising for</span>
      ${['balanced', 'income', 'growth', 'stability'].map((h) => `<button class="horizon ${STATE.horizon === h ? 'on' : ''}" data-h="${h}" style="font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid ${STATE.horizon === h ? '#33507a' : 'var(--line2)'};background:${STATE.horizon === h ? '#1b2637' : 'transparent'};color:${STATE.horizon === h ? '#cfe0ff' : 'var(--ink2)'}">${h}</button>`).join('')}
    </div>
    <div class="row" style="gap:6px;margin-bottom:12px;flex-wrap:wrap">
      <span class="muted" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:2px">Sort</span>
      ${[['score', 'Match'], ['income', 'Income'], ['odds', 'Odds'], ['fresh', 'Newest']].map(([k, l]) => `<button class="sortbtn ${STATE.sort === k ? 'on' : ''}" data-s="${k}" style="font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid ${STATE.sort === k ? '#33507a' : 'var(--line2)'};background:${STATE.sort === k ? '#1b2637' : 'transparent'};color:${STATE.sort === k ? '#cfe0ff' : 'var(--ink2)'}">${l}</button>`).join('')}
    </div>
    <div class="types" id="types">
      <button data-t="" class="${STATE.types.length ? '' : 'on'}">All types</button>
      ${Object.keys(s.counts).map((t) => `<button data-t="${t}" class="${STATE.types.includes(t) ? 'on' : ''}">${TYPE_LABEL[t] || t} <span class="muted">${s.counts[t]}</span></button>`).join('')}
    </div>
    <div class="filters">
      <input id="f-q" placeholder="Filter by title, company or skill…" value="${esc(FILTERS.q)}"/>
      <select id="f-country"><option value="">All countries</option>${[...new Set(feed.opportunities.map((o) => o.country).filter(Boolean))].sort().map((c) => `<option value="${c}" ${FILTERS.country === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <select id="f-family"><option value="">All roles</option>${[...new Set(feed.opportunities.map((o) => o.role_family).filter(Boolean))].sort().map((c) => `<option value="${c}" ${FILTERS.family === c ? 'selected' : ''}>${c.replace(/_/g, ' ')}</option>`).join('')}</select>
      <select id="f-seniority"><option value="">All levels</option>${['junior', 'mid', 'senior', 'staff', 'lead', 'principal'].map((c) => `<option value="${c}" ${FILTERS.seniority === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <select id="f-degree">
        <option value="">Any education</option>
        <option value="open" ${FILTERS.degree === 'open' ? 'selected' : ''}>no degree required</option>
        <option value="unknown" ${FILTERS.degree === 'unknown' ? 'selected' : ''}>requirement unstated</option>
        <option value="required" ${FILTERS.degree === 'required' ? 'selected' : ''}>degree required</option>
      </select>
      <label class="chk"><input type="checkbox" id="f-visa" ${FILTERS.visa ? 'checked' : ''}/> visa sponsorship only</label>
      <span class="muted" id="f-count" style="font-size:12px"></span>
    </div>
    <div class="feed-wrap">
      <div id="opps"></div>
      <div class="facets">
        <div class="card">
          <h3>Your market right now</h3>
          <div id="facet-body" style="margin-top:10px"><span class="muted" style="font-size:12px">Loading…</span></div>
        </div>
        <div class="card" style="margin-top:12px">
          <h3>Shortcuts</h3>
          <div style="margin-top:8px;font-size:12px;line-height:2">
            <div><kbd>J</kbd> <kbd>K</kbd> move · <kbd>↵</kbd> open</div>
            <div><kbd>S</kbd> save · <kbd>A</kbd> applied</div>
            <div><kbd>⌘</kbd><kbd>K</kbd> search everything</div>
            <div><kbd>?</kbd> all shortcuts</div>
          </div>
        </div>
      </div>
    </div>
  `;

  const apply = () => {
    const q = FILTERS.q.toLowerCase();
    const rows = feed.opportunities.filter((o) =>
      (!q || `${o.title} ${o.company} ${(o.skills || []).join(' ')}`.toLowerCase().includes(q)) &&
      (!FILTERS.country || o.country === FILTERS.country) &&
      (!FILTERS.family || o.role_family === FILTERS.family) &&
      (!FILTERS.seniority || o.seniority === FILTERS.seniority) &&
      (!FILTERS.visa || o.visa_sponsorship === 'yes') &&
      (!FILTERS.degree || (FILTERS.degree === 'open' ? (o.degree_requirement === 'not_required' || o.degree_requirement === 'unknown') : o.degree_requirement === FILTERS.degree)));
    const capped = STATE.plan && STATE.plan.plan !== 'pro' ? rows.slice(0, STATE.plan.limits.matches) : rows;
    const sortKey = STATE.sort || 'score';
    rows.sort((a, b) => {
      if (sortKey === 'income') return (b.income_potential - a.income_potential) || (b.match_score - a.match_score);
      if (sortKey === 'odds') return (b.interview_probability - a.interview_probability) || (b.match_score - a.match_score);
      if (sortKey === 'fresh') return new Date(b.posted_at) - new Date(a.posted_at);
      return b.match_score - a.match_score;
    });
    $('#opps').innerHTML = capped.length ? capped.map((o, i) => oppCard(o, i)).join('') + (capped.length < rows.length ? `<div class="card" style="text-align:center;border-color:#2f2a4d"><div class="dim" style="font-size:13px">${rows.length - capped.length} more scored opportunities are hidden on the Free plan.</div><div style="margin-top:10px"><button class="btn sm" onclick="go('plan')">See what Pro unlocks</button></div></div>` : '') : '<div class="empty">No opportunities match those filters. Loosen one.</div>';
    $('#f-count').textContent = `${rows.length} of ${feed.opportunities.length} shown`;
    bindOppActions();
    renderFacets(rows);
  };
  $('#f-q').oninput = (e) => { FILTERS.q = e.target.value; apply(); };
  $('#f-country').onchange = (e) => { FILTERS.country = e.target.value; apply(); };
  $('#f-family').onchange = (e) => { FILTERS.family = e.target.value; apply(); };
  $('#f-seniority').onchange = (e) => { FILTERS.seniority = e.target.value; apply(); };
  $('#f-visa').onchange = (e) => { FILTERS.visa = e.target.checked; apply(); };
  $('#f-degree').onchange = (e) => { FILTERS.degree = e.target.value; apply(); };
  apply();

  document.querySelectorAll('.action').forEach((a) => {
    a.onclick = () => { if (a.dataset.opp) openDetail(a.dataset.opp); else go('rates'); };
  });
  const up = $('#upgrade');
  if (up) up.onclick = () => go('plan');
  document.querySelectorAll('.sortbtn').forEach((b) => {
    b.onclick = () => { STATE.sort = b.dataset.s; apply(); document.querySelectorAll('.sortbtn').forEach((x) => x.classList.toggle('on', x.dataset.s === STATE.sort)); renderRadar; };
  });
  document.querySelectorAll('.horizon').forEach((b) => {
    b.onclick = async () => {
      STATE.horizon = b.dataset.h;
      await post('/api/horizon', { horizon: b.dataset.h });
      renderRadar();
      toast('Ranking re-weighted for ' + b.dataset.h);
    };
  });
  // Keyboard-first navigation: j/k or arrows move the cursor, Enter opens, s saves, a marks applied.
  const rows = () => [...document.querySelectorAll('#opps .opp')];
  let cursor = -1;
  const paint = () => {
    rows().forEach((el, i) => {
      el.style.outline = i === cursor ? '1px solid #33507a' : 'none';
      el.style.background = i === cursor ? '#161e2a' : 'var(--panel)';
    });
  };
  const keyHandler = async (e) => {
    if (e.target.matches('input,textarea,select')) return;
    if (PAL.open) return;
    const list = rows();
    if (!list.length) return;
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); cursor = Math.min(list.length - 1, cursor + 1); paint(); list[cursor].scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); cursor = Math.max(0, cursor - 1); paint(); list[cursor].scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter' && cursor >= 0) { openDetail(list[cursor].dataset.id); }
    else if (e.key === 's' && cursor >= 0) { await post('/api/applications', { opportunityId: list[cursor].dataset.id, status: 'saved' }); toast('Saved'); }
    else if (e.key === 'a' && cursor >= 0) { await post('/api/applications', { opportunityId: list[cursor].dataset.id, status: 'applied' }); toast('Marked applied — momentum updated'); }
    else if (e.key === '?') { showHelp(); }
  };
  document.removeEventListener('keydown', STATE._keys || (() => {}));
  STATE._keys = keyHandler;
  document.addEventListener('keydown', keyHandler);

  $('#types').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const t = b.dataset.t;
    if (!t) STATE.types = [];
    else STATE.types = STATE.types.includes(t) ? STATE.types.filter((x) => x !== t) : [...STATE.types, t];
    renderRadar();
  };
}

function renderFacets(rows) {
  const body = $('#facet-body');
  if (!body) return;
  if (!rows.length) { body.innerHTML = '<span class="muted" style="font-size:12px">No rows match.</span>'; return; }
  const CUR = { EUR: 1, USD: 0.92, GBP: 1.17, CHF: 1.05, CAD: 0.68, PLN: 0.23, INR: 0.011 };
  const annual = (o) => {
    if (o.comp_min == null) return null;
    const v = ((Number(o.comp_min) + Number(o.comp_max || o.comp_min)) / 2) * (CUR[o.currency] || 1);
    if (o.comp_period === 'hour') return v * 1600;
    if (o.comp_period === 'month') return v * 12;
    if (o.comp_period === 'day') return v * 220;
    return v;
  };
  const comps = rows.map(annual).filter((v) => v && v > 15000 && v < 600000).sort((a, b) => a - b);
  const med = comps.length ? comps[Math.floor(comps.length / 2)] : null;
  const top = rows[0];

  const byCountry = {};
  rows.forEach((o) => { if (o.country) byCountry[o.country] = (byCountry[o.country] || 0) + 1; });
  const countries = Object.entries(byCountry).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxC = Math.max(...countries.map((c) => c[1]), 1);

  const byFamily = {};
  rows.forEach((o) => { if (o.role_family) byFamily[o.role_family] = (byFamily[o.role_family] || 0) + 1; });
  const families = Object.entries(byFamily).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const maxF = Math.max(...families.map((f) => f[1]), 1);

  const strong = rows.filter((o) => o.interview_probability >= 40).length;
  const remote = rows.filter((o) => o.remote_type === 'remote').length;

  body.innerHTML = `
    <div class="facet-row"><span class="muted">Median pay</span><span class="mono">${med ? money(med) : '—'}</span></div>
    <div class="facet-row"><span class="muted">Best match</span><span class="mono">${top.match_score}/100</span></div>
    <div class="facet-row"><span class="muted">≥40% interview odds</span><span class="mono">${strong} of ${rows.length}</span></div>
    <div class="facet-row"><span class="muted">Remote</span><span class="mono">${Math.round((remote / rows.length) * 100)}%</span></div>
    <div style="margin-top:12px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Top locations</div>
    ${countries.map(([c, n]) => `<div style="margin-top:6px"><div class="facet-row" style="border:none;padding:0"><span>${esc(c)}</span><span class="mono muted">${n}</span></div><div class="facet-mini"><i style="width:${Math.round((n / maxC) * 100)}%"></i></div></div>`).join('')}
    <div style="margin-top:12px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Disciplines</div>
    ${families.map(([f, n]) => `<div style="margin-top:6px"><div class="facet-row" style="border:none;padding:0"><span>${esc(f.replace(/_/g, ' '))}</span><span class="mono muted">${n}</span></div><div class="facet-mini"><i style="width:${Math.round((n / maxF) * 100)}%"></i></div></div>`).join('')}
  `;
}

async function renderCopilot() {
  $('#view').innerHTML = `
    <div class="chat">
      <div class="suggest">
        ${['What should I do next?', 'Am I underpaid?', 'Which skills are blocking me?', 'What is realistic for relocating to Germany?', 'How am I doing overall?'].map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}
      </div>
      <div class="msgs" id="msgs">
        <div class="msg bot">I answer only from your data — your twin, your matches, your rate benchmark, your scores. Ask me something specific.</div>
      </div>
      <div class="composer">
        <input id="q" placeholder="Ask about your rate, your next move, your gaps…"/>
        <button class="btn" id="send">Ask</button>
      </div>
    </div>`;
  const send = async (text) => {
    const q = text || $('#q').value.trim(); if (!q) return;
    $('#q').value = '';
    const msgs = $('#msgs');
    msgs.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(q)}</div>`);
    msgs.scrollTop = msgs.scrollHeight;
    const res = await post('/api/copilot', { message: q });
    const cites = (res.citations || []).map((c) => `${c.label}: ${c.detail}`).join(' · ');
    msgs.insertAdjacentHTML('beforeend', `<div class="msg bot">${esc(res.reply)}${cites ? `<div class="cite">Grounded in — ${esc(cites)}</div>` : ''}</div>`);
    msgs.scrollTop = msgs.scrollHeight;
  };
  $('#send').onclick = () => send();
  $('#q').onkeydown = (e) => { if (e.key === 'Enter') send(); };
  document.querySelectorAll('.suggest button').forEach((b) => { b.onclick = () => send(b.dataset.q); });
}

async function go(view) {
  STATE.view = view;
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  const [fn, title, sub] = VIEWS[view];
  $('#view-title').textContent = title;
  $('#view-sub').textContent = sub;

  try { await fn(); } catch (e) { $('#view').innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>'; }
}

async function boot() {
  const auth = await api('/api/auth/me');
  STATE.authed = !!auth.user;
  STATE.userRecord = auth.user;
  if (!STATE.authed) {
    $('#profile-pill').textContent = 'signed out';
    $('#nav').style.opacity = '.35';
    $('#nav').style.pointerEvents = 'none';
    return;
  }
  $('#nav').style.opacity = '1';
  $('#nav').style.pointerEvents = 'auto';
  const me = await api('/api/me');
  STATE.user = me.user; STATE.profile = me.profile;
  const health = await api('/api/health');
  STATE.engineCounts = health.counts;
  $('#profile-pill').textContent = me.profile ? `${me.profile.seniority} · ${me.profile.years_experience || '?'} yrs` : 'no profile';
  if (me.profile && me.profile.risk_tolerance === 'aggressive') STATE.horizon = 'growth';
  if (me.profile && me.profile.time_to_move === 'asap') STATE.horizon = 'income';
  $('#engine-counts').textContent = `${health.counts.opportunities} opportunities · ${health.counts.sources} sources`;
  try {
    const b = await api('/api/brief');
    const badge = $('#new-badge');
    if (b && b.unread) { badge.style.display = 'inline-block'; badge.textContent = b.unread + ' new'; badge.className = 'chip have'; }
  } catch (e) {}
  $('#engine-status').textContent = 'engine online';
}

function showHelp() {
  const el = document.createElement('div');
  el.className = 'palette open';
  el.innerHTML = `<div class="palette-box" style="padding:22px">
    <div style="font-size:15px;font-weight:650;margin-bottom:12px">Keyboard</div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px">
      <span><kbd>⌘</kbd><kbd>K</kbd></span><span>Command palette — search everything, jump anywhere</span>
      <span><kbd>J</kbd> <kbd>K</kbd> or <kbd>↑</kbd><kbd>↓</kbd></span><span>Move through the feed</span>
      <span><kbd>↵</kbd></span><span>Open the selected opportunity</span>
      <span><kbd>S</kbd></span><span>Save it</span>
      <span><kbd>A</kbd></span><span>Mark it as applied</span>
      <span><kbd>?</kbd></span><span>This panel</span>
      <span><kbd>esc</kbd></span><span>Close anything</span>
    </div>
    <div class="muted" style="font-size:12px;margin-top:16px">Built to be used with hands on the keyboard — the same way you would use a terminal, not a job board.</div>
  </div>`;
  el.onclick = (e) => { if (e.target === el || e.target.closest('.palette-box') === null) el.remove(); };
  document.body.appendChild(el);
}

/* ---------------- morning brief view ---------------- */
async function renderBrief() {
  const b = await api('/api/brief');
  if (!b || b.needsOnboarding) return renderOnboarding();
  const dates = [0, 1, 2, 3].map((d) => new Date(Date.now() - d * 86400000));
  $('#view').innerHTML = `
    <div class="grid" style="grid-template-columns:1fr 300px">
      <div>
        <div class="card" style="border-color:#253247;background:linear-gradient(180deg,#131a24,#11151b)">
          <div class="muted" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase">Brief · ${new Date(b.generatedAt).toLocaleString('en-GB', { weekday: 'long', hour: '2-digit', minute: '2-digit' })}</div>
          <div style="font-size:20px;font-weight:650;margin-top:8px;letter-spacing:-.02em;line-height:1.35">${esc(b.headline)}</div>
          <div class="row" style="margin-top:16px;gap:20px;flex-wrap:wrap">
            <div><div class="big mono" style="font-size:22px">${b.counts.newSinceYesterday}</div><div class="muted" style="font-size:11px">new since yesterday</div></div>
            <div><div class="big mono" style="font-size:22px">${b.counts.newHighMatch}</div><div class="muted" style="font-size:11px">at 80+ match</div></div>
            <div><div class="big mono" style="font-size:22px">${b.counts.closingSoon}</div><div class="muted" style="font-size:11px">closing within 72h</div></div>
            <div><div class="big mono" style="font-size:22px">${b.counts.totalScored}</div><div class="muted" style="font-size:11px">in your scored set</div></div>
          </div>
        </div>

        <h2 class="section">Do these, in this order</h2>
        <div class="card">
          ${b.actions.map((a, i) => `<div class="action" data-opp="${a.opportunityId || ''}" style="display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer">
            <div class="mono" style="color:var(--muted);font-size:12px;width:18px;padding-top:2px">${i + 1}</div>
            <div style="flex:1"><div style="font-size:13.5px">${esc(a.text)}</div><div class="muted" style="font-size:11px;margin-top:2px">${a.priority === 1 ? 'do now' : a.priority === 2 ? 'this week' : 'keep warm'}</div></div>
            <div style="opacity:.5">&gt;</div>
          </div>`).join('')}
        </div>

        <h2 class="section">New at your bar</h2>
        <div>${(b.newHighMatch || []).map(oppCard).join('') || '<div class="card muted">Nothing new at 80+ since your last visit.</div>'}</div>

        ${b.searchHits && b.searchHits.length ? `<h2 class="section">Your saved searches found</h2>
        ${b.searchHits.map((s) => `<div class="card" style="margin-bottom:10px"><h3>${esc(s.name)}</h3><div class="dim" style="font-size:12px;margin-top:6px">${s.hits.map((h) => esc(h.title) + ' · ' + esc(h.company) + ' <span class="muted">(' + h.match_score + ')</span>').join('<br/>')}</div></div>`).join('')}` : ''}
      </div>
      <div>
        <div class="card">
          <h3>Signal of the day</h3>
          ${b.rates ? `<div class="kv" style="margin-top:10px"><span>Your market median</span><span class="mono">${money(b.rates.p50)}</span></div>
          <div class="kv"><span>Your position</span><span class="mono" style="color:${b.rates.gapPct > 5 ? '#ff8f96' : '#6fe3a4'}">${b.rates.gapPct > 0 ? b.rates.gapPct + '% below' : Math.abs(b.rates.gapPct) + '% above'}</span></div>` : ''}
          ${b.topGap ? `<div class="kv"><span>Biggest blocker</span><span class="mono">${esc(b.topGap.skill)} <span class="muted">(${b.topGap.blocking})</span></span></div>` : ''}
          ${b.scoreDelta != null ? `<div class="kv"><span>Career Score change</span><span class="mono">${b.scoreDelta > 0 ? '+' : ''}${b.scoreDelta}</span></div>` : ''}
        </div>
        <div class="card" style="margin-top:14px">
          <h3>Delivery</h3>
          <div class="dim" style="font-size:12.5px;margin-top:8px">This brief is generated fresh from your twin every time you open it. On Pro it also arrives by email each morning at 07:30 — that is what turns a tool into a habit.</div>
          <div style="margin-top:12px">${[0, 1, 2, 3].map((d) => `<div class="kv"><span>${dates[d].toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</span><span class="muted">${d === 0 ? 'today · live' : 'delivered'}</span></div>`).join('')}</div>
        </div>
      </div>
    </div>`;
  document.querySelectorAll('.action').forEach((a) => {
    a.onclick = () => { if (a.dataset.opp) openDetail(a.dataset.opp); else go('rates'); };
  });
  bindOppActions();
}

/* ---------------- command palette ---------------- */
let PAL = { open: false, items: [], sel: 0 };

function openPalette() {
  PAL.open = true;
  $('#palette').classList.add('open');
  $('#palette-input').value = '';
  $('#palette-input').focus();
  buildPalette('');
}
function closePalette() { PAL.open = false; $('#palette').classList.remove('open'); }

function buildPalette(q) {
  const query = q.trim().toLowerCase();
  const cmds = [
    ...Object.entries(VIEWS).map(([k, v]) => ({ kind: 'go', label: v[1], hint: v[2], action: () => go(k) })),
    { kind: 'cmd', label: 'Run live ingest', hint: 'Fetch from all four adapters now', action: async () => { toast('Ingesting…'); const r = await post('/api/ingest', {}); toast(`${r.inserted} new · ${r.merged} merged`); await boot(); go(STATE.view); } },
    { kind: 'cmd', label: 'Load demo persona', hint: '8 years, €78k, targeting DE/NL', action: loadDemo },
    { kind: 'cmd', label: 'Open strategy documents', hint: 'The business analysis behind this product', action: () => { window.open('/strategy.html', '_blank'); } },
  ];
  const opps = (STATE.feed?.opportunities || []).slice(0, 300).map((o) => ({
    kind: 'opp', label: `${o.title} · ${o.company}`, hint: `${o.city}${o.country ? ', ' + o.country : ''} · ${o.match_score}/100`, score: o.match_score, action: () => openDetail(o.id),
  }));
  const pool = query ? [...cmds, ...opps] : cmds;
  PAL.items = pool.filter((i) => !query || (i.label + ' ' + i.hint).toLowerCase().includes(query)).slice(0, 24);
  PAL.sel = 0;
  renderPalette();
}
function renderPalette() {
  $('#palette-list').innerHTML = PAL.items.length ? PAL.items.map((it, i) => `
    <div class="palette-item ${i === PAL.sel ? 'sel' : ''}" data-i="${i}">
      <span class="k">${it.kind === 'go' ? 'go' : it.kind === 'cmd' ? 'cmd' : 'opp'}</span>
      <span>${esc(it.label)}</span>
      ${it.score != null ? `<span class="s" style="color:${scoreColor(it.score)[0]}">${it.score}</span>` : `<span class="s">${esc(it.hint || '')}</span>`}
    </div>`).join('') : '<div style="padding:16px;color:var(--muted);font-size:13px">Nothing matches.</div>';
  document.querySelectorAll('.palette-item').forEach((el) => {
    el.onclick = () => { const it = PAL.items[Number(el.dataset.i)]; closePalette(); it.action(); };
  });
}
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); PAL.open ? closePalette() : openPalette(); return; }
  if (!PAL.open) return;
  if (e.key === 'Escape') return closePalette();
  if (e.key === 'ArrowDown') { e.preventDefault(); PAL.sel = Math.min(PAL.items.length - 1, PAL.sel + 1); renderPalette(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); PAL.sel = Math.max(0, PAL.sel - 1); renderPalette(); }
  if (e.key === 'Enter') { const it = PAL.items[PAL.sel]; if (it) { closePalette(); it.action(); } }
});
$('#palette').addEventListener('click', (e) => { if (e.target.id === 'palette') closePalette(); });

document.querySelectorAll('#nav button').forEach((b) => { b.onclick = () => go(b.dataset.view); });
// Theme: follows the system on first visit, then remembers an explicit choice.
(function initTheme() {
  const saved = localStorage.getItem('careeros-theme');
  const system = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = saved || system;
})();
$('#theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('careeros-theme', next);
  toast(next === 'light' ? 'Light theme' : 'Dark theme');
};
$('#cmdk').onclick = openPalette;
$('#load-demo').onclick = loadDemo;
$('#run-ingest').onclick = async () => {
  const b = $('#run-ingest');
  b.disabled = true; b.innerHTML = '<span class="spin"></span>Ingesting…';
  const r = await post('/api/ingest', {});
  b.disabled = false; b.textContent = 'Run ingest';
  toast(`${r.fetched} fetched · ${r.kept} kept · ${r.inserted} new · ${r.droppedNonTech} non-tech dropped · ${r.ms}ms`);
  await boot();
  go(STATE.view);
};

$('#palette-input').addEventListener('input', (e) => buildPalette(e.target.value));

$('#logout') && ($('#logout').onclick = async () => { await post('/api/auth/logout', {}); STATE.authed = false; await boot(); go('auth'); });

(async () => {
  await boot();
  if (!STATE.authed) { go('auth'); return; }
  go(STATE.profile ? 'radar' : 'onboard');
})();
</script>
